<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Bônus - Redefinir senha</title>

    <link rel="icon" type="image/png" href="imagens/logo-painel.png">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <script src="tema.js?v=20261109a"></script>
    <link rel="stylesheet" href="style.css?v=20261109a">
</head>
<body class="corpo-login">
    <div class="cartao-login">
        <div class="login-topo">
            <img class="login-logo" src="imagens/logo-painel.png" alt="" width="128" height="128">
            <h1>Painel de Bônus</h1>
            <span class="subtitulo-toyota">AutoService</span>
            <p id="subtitulo-login">Defina sua nova senha</p>
        </div>

        <form id="formulario-redefinir">
            <div class="campo-login">
                <label for="campo-nova">Nova Senha</label>
                <div class="campo-entrada"><svg class="campo-icone" viewBox="0 0 20 20" width="17" height="17" aria-hidden="true"><rect x="4" y="9" width="12" height="8" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M7 9V6.5a3 3 0 0 1 6 0V9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><input type="password" id="campo-nova" placeholder="••••••••" required minlength="8" autocomplete="new-password"><button type="button" class="campo-olho" data-alvo="campo-nova" aria-label="Mostrar senha"><svg viewBox="0 0 20 20" width="17" height="17" aria-hidden="true"><path d="M1.8 10S5 4.5 10 4.5 18.2 10 18.2 10 15 15.5 10 15.5 1.8 10 1.8 10z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><circle cx="10" cy="10" r="2.4" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></button></div>
            </div>
            <div class="campo-login">
                <label for="campo-confirma">Confirmar Nova Senha</label>
                <div class="campo-entrada"><svg class="campo-icone" viewBox="0 0 20 20" width="17" height="17" aria-hidden="true"><rect x="4" y="9" width="12" height="8" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M7 9V6.5a3 3 0 0 1 6 0V9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><input type="password" id="campo-confirma" placeholder="••••••••" required minlength="8" autocomplete="new-password"><button type="button" class="campo-olho" data-alvo="campo-confirma" aria-label="Mostrar senha"><svg viewBox="0 0 20 20" width="17" height="17" aria-hidden="true"><path d="M1.8 10S5 4.5 10 4.5 18.2 10 18.2 10 15 15.5 10 15.5 1.8 10 1.8 10z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><circle cx="10" cy="10" r="2.4" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></button></div>
            </div>
            <div class="login-acoes">
                <button type="submit" id="btn-redefinir" class="botao-login-principal" disabled>Aguarde...</button>
                <a href="login.html" class="link-esqueci-senha link-voltar-login">Voltar para o login</a>
            </div>

            <div id="mensagem-status" class="mensagem-status"></div>
        </form>
    </div>

    <script src="redefinir.js?v=20261109a"></script>
</body>
</html>
