<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Bônus - Autenticação</title>

    <link rel="icon" href="imagens/icone-sem-fundo.png" type="image/favicon">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        .select-equipe-estilizado {
            height: 42px;
            width: 100%;
            padding: 0 12px;
            border: 1px solid var(--cor-borda-input);
            border-radius: 6px;
            font-size: 13.5px;
            font-weight: 500;
            color: var(--texto-principal);
            background-color: #ffffff;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .select-equipe-estilizado:focus {
            border-color: var(--cor-destaque);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }
        .select-equipe-estilizado optgroup {
            font-weight: 700;
            color: #64748b;
        }
    </style>
</head>
<body class="corpo-login">
    <div class="cartao-login">
        <div class="login-topo">
            <h1>Painel de Bônus</h1>
            <span class="subtitulo-toyota">AutoService</span>
            <p id="subtitulo-login">Acesse sua conta para continuar</p>
        </div>

        <div class="abas-login">
            <button type="button" id="aba-entrar" class="aba-item ativa">Entrar</button>
            <button type="button" id="aba-cadastrar" class="aba-item">Criar Conta</button>
        </div>

        <form id="formulario-autenticacao">
            <div class="campo-login oculto" id="grupo-nome">
                <label for="campo-nome">Nome Completo</label>
                <input type="text" id="campo-nome" placeholder="Digite seu nome completo">
            </div>

            <div class="campo-login">
                <label for="campo-email">E-mail Corporativo</label>
                <input type="email" id="campo-email" placeholder="seu.email@grupobarigui.com.br" required>
            </div>

            <div class="campo-login">
                <label for="campo-senha">Senha</label>
                <input type="password" id="campo-senha" placeholder="••••••••" required minlength="6">
            </div>

            <div class="campo-login oculto" id="grupo-senha-confirma">
                <label for="campo-senha-confirma">Confirmar Senha</label>
                <input type="password" id="campo-senha-confirma" placeholder="••••••••" minlength="6">
            </div>

            <div class="campo-login oculto" id="grupo-equipe">
                <label for="campo-equipe">Marca / Equipe de Trabalho</label>
                <select id="campo-equipe" class="select-equipe-estilizado">
                    <option value="" disabled selected>Selecione a sua equipe...</option>
                    
                    <optgroup label="Marcas Individuais">
                        <option value="Toyota">Toyota</option>
                        <option value="Chery">Chery</option>
                        <option value="Fiat">Fiat</option>
                        <option value="Ford">Ford</option>
                        <option value="Nissan">Nissan</option>
                        <option value="Volkswagen">Volkswagen</option>
                        <option value="Hyundai">Hyundai</option>
                    </optgroup>

                    <optgroup label="Multimarcas (Mais de uma marca)">
                        <option value="Renault | BYD | Geely">Renault | BYD | Geely</option>
                        <option value="Audi | Citroen | Kia | Omoda">Audi | Citroën | Kia | Omoda</option>
                    </optgroup>
                </select>
            </div>

            <div class="login-acoes">
                <button type="submit" id="btn-submit-auth" class="botao-login-principal">
                    Acessar Painel
                </button>
            </div>

            <div id="mensagem-status" class="mensagem-status"></div>
        </form>
    </div>

    <script src="login.js"></script>
</body>
</html>
