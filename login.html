<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar - Painel de Bônus</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="corpo-login">
    <div class="cartao-login">
        <div class="login-topo">
            <h1>Painel de Bônus</h1>
            <span class="subtitulo-toyota">Toyota Service</span>
            <p>Entre com o seu e-mail para aceder aos seus agendamentos</p>
        </div>

        <form id="form-login">
            <div class="campo-login">
                <label for="nome-completo">Nome Completo</label>
                <input type="text" id="nome-completo" placeholder="O seu nome ou apelido">
            </div>

            <div class="campo-login">
                <label for="email">E-mail</label>
                <input type="email" id="email" required placeholder="seuemail@exemplo.com">
            </div>

            <div class="campo-login">
                <label for="senha">Senha</label>
                <input type="password" id="senha" required placeholder="Mínimo 6 caracteres">
            </div>

            <div class="login-acoes">
                <button type="submit" id="btn-entrar" class="botao-adicionar" style="width: 100%; height: 40px;">Entrar</button>
                <button type="button" id="btn-cadastrar" class="botao-secundario">Criar Conta</button>
            </div>
        </form>

        <p id="mensagem-status" class="mensagem-status"></p>
    </div>

    <script src="login.js"></script>
</body>
</html>
