<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Bônus - Acesso</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="corpo-login">
    <div class="cartao-login">
        <div class="login-topo">
            <h1>Painel de Bônus</h1>
            <span class="subtitulo-toyota">AutoService</span>
            <p id="subtitulo-modo">Entre com o seu e-mail para acessar seus agendamentos</p>
        </div>

        <div class="abas-login">
            <button type="button" id="aba-entrar" class="aba-item ativa">Entrar</button>
            <button type="button" id="aba-cadastrar" class="aba-item">Criar Conta</button>
        </div>

        <form id="form-auth">
            <div class="campo-login" id="grupo-nome" style="display: none;">
                <label for="nome-completo">Nome Completo</label>
                <input type="text" id="nome-completo" placeholder="Seu nome ou apelido">
            </div>

            <div class="campo-login">
                <label for="email">E-mail</label>
                <input type="email" id="email" required placeholder="seuemail@exemplo.com">
            </div>

            <div class="campo-login">
                <label for="senha">Senha</label>
                <input type="password" id="senha" required placeholder="Mínimo 6 caracteres">
            </div>

            <div class="campo-login" id="grupo-confirmar-senha" style="display: none;">
                <label for="confirmar-senha">Confirmar Senha</label>
                <input type="password" id="confirmar-senha" placeholder="Repita sua senha">
            </div>

            <div class="login-acoes">
                <button type="submit" id="btn-submit" class="botao-adicionar" style="width: 100%; height: 42px;">Entrar</button>
            </div>
        </form>

        <p id="mensagem-status" class="mensagem-status"></p>
    </div>

    <script src="login.js"></script>
</body>
</html>
