<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Bônus - Autenticação</title>

    <link rel="icon" type="image/png" href="imagens/logo-painel.png">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <script src="tema.js?v=20261107h"></script>
    <script src="dropdown.js?v=20261107h" defer></script>
    <link rel="stylesheet" href="style.css?v=20261107h">
</head>
<body class="corpo-login">
    <div class="cartao-login">
        <div class="login-topo">
            <img class="login-logo" src="imagens/logo-painel.png" alt="" width="128" height="128">
            <h1>Painel de Bônus</h1>
            <span class="subtitulo-toyota">AutoService</span>
            <p id="subtitulo-login">Acesse sua conta para continuar</p>
        </div>

        <div class="abas-login">
            <button type="button" id="aba-entrar" class="aba-item ativa">Entrar</button>
            <button type="button" id="aba-cadastrar" class="aba-item">Criar Conta</button>
        </div>

        <form id="formulario-autenticacao">
            <div class="campo-login oculto" id="grupo-nome">
                <label for="campo-nome">Nome Completo</label>
                <div class="campo-entrada"><svg class="campo-icone" viewBox="0 0 20 20" width="17" height="17" aria-hidden="true"><circle cx="10" cy="7" r="3.2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M3.8 16.5c.8-3 3.3-4.5 6.2-4.5s5.4 1.5 6.2 4.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><input type="text" id="campo-nome" placeholder="Digite seu nome completo"></div>
            </div>

            <div class="campo-login">
                <label for="campo-email">E-mail Corporativo</label>
                <div class="campo-entrada"><svg class="campo-icone" viewBox="0 0 20 20" width="17" height="17" aria-hidden="true"><rect x="2.5" y="4.5" width="15" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="m3.5 6 6.5 5 6.5-5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg><input type="email" id="campo-email" placeholder="seu.email@grupobarigui.com.br" required></div>
            </div>

            <div class="campo-login">
                <label for="campo-senha">Senha</label>
                <div class="campo-entrada"><svg class="campo-icone" viewBox="0 0 20 20" width="17" height="17" aria-hidden="true"><rect x="4" y="9" width="12" height="8" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M7 9V6.5a3 3 0 0 1 6 0V9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><input type="password" id="campo-senha" placeholder="••••••••" required minlength="6"><button type="button" class="campo-olho" data-alvo="campo-senha" aria-label="Mostrar senha"><svg viewBox="0 0 20 20" width="17" height="17" aria-hidden="true"><path d="M1.8 10S5 4.5 10 4.5 18.2 10 18.2 10 15 15.5 10 15.5 1.8 10 1.8 10z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><circle cx="10" cy="10" r="2.4" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></button></div>
            </div>

            <div class="campo-login oculto" id="grupo-senha-confirma">
                <label for="campo-senha-confirma">Confirmar Senha</label>
                <div class="campo-entrada"><svg class="campo-icone" viewBox="0 0 20 20" width="17" height="17" aria-hidden="true"><rect x="4" y="9" width="12" height="8" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M7 9V6.5a3 3 0 0 1 6 0V9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><input type="password" id="campo-senha-confirma" placeholder="••••••••" minlength="6"><button type="button" class="campo-olho" data-alvo="campo-senha-confirma" aria-label="Mostrar senha"><svg viewBox="0 0 20 20" width="17" height="17" aria-hidden="true"><path d="M1.8 10S5 4.5 10 4.5 18.2 10 18.2 10 15 15.5 10 15.5 1.8 10 1.8 10z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><circle cx="10" cy="10" r="2.4" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></button></div>
            </div>

            <div class="campo-login oculto" id="grupo-equipe">
                <label for="campo-equipe">Marca / Equipe de Trabalho</label>
                <select id="campo-equipe" class="select-equipe-estilizado">
                    <option value="" disabled selected>Selecione a sua equipe...</option>
                    
                    <optgroup label="Marcas Individuais">
                        <option value="Toyota">Toyota</option>
                        <option value="Chery">Chery</option>
                        <option value="Fiat">Fiat</option>
                        <option value="Ford">Ford</option>
                        <option value="Nissan">Nissan</option>
                        <option value="Volkswagen">Volkswagen</option>
                        <option value="Hyundai">Hyundai</option>
                    </optgroup>

                    <optgroup label="Multimarcas (Mais de uma marca)">
                        <option value="Renault | BYD | Geely">Renault | BYD | Geely</option>
                        <option value="Audi | Citroen | Kia | Omoda">Audi | Citroën | Kia | Omoda</option>
                    </optgroup>
                </select>
            </div>

            <div class="login-acoes">
                <button type="submit" id="btn-submit-auth" class="botao-login-principal">
                    Acessar Painel
                </button>
                <button type="button" id="btn-esqueci-senha" class="link-esqueci-senha">Esqueci minha senha</button>
            </div>

            <div id="mensagem-status" class="mensagem-status"></div>
        </form>

    </div>

    <script src="login.js?v=20261107h"></script>
</body>
</html>
